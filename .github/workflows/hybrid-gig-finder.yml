name: Hybrid gig finder v2
on:
  workflow_dispatch:
    inputs:
      window_start:
        description: "Inclusive start date (YYYY-MM-DD); blank means today UTC"
        required: false
        type: string
      window_end:
        description: "Inclusive end date (YYYY-MM-DD); blank means start + 13 days"
        required: false
        type: string
  schedule:
    - cron: "0 8 * * 1"
permissions:
  contents: read
concurrency:
  group: hybrid-gig-finder-v2
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect accessible public venue pages (no paid API)
        env:
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
          RUN_DIR: artifacts/current
        run: python -m hybrid.research
      - name: Deterministic validation and artist matching
        if: always() && hashFiles('artifacts/current/research_events.json') != ''
        env:
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
          RUN_DIR: artifacts/current
        run: python -m hybrid.match
      - name: Upload evidence, matches and coverage ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-gig-finder-${{ github.run_number }}
          path: artifacts/current/
          if-no-files-found: warn
          retention-days: 90
